name: Desktop CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Engine Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
      - name: Run calculation engine tests
        run: |
          cd packages/calculation_engine
          dart pub get
          dart analyze
          dart test

  data-tests:
    name: Data Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
      - name: Run SQLite and data pack tests
        run: |
          cd packages/game_data
          dart pub get
          dart analyze
          dart test

  flutter-tests:
    name: Flutter Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
      - name: Sync empty first-party bootstrap pack into desktop assets
        run: python tools/sync_desktop_pack.py
      - name: Resolve desktop dependencies
        working-directory: apps/desktop
        run: flutter pub get
      - name: Dart static analysis
        working-directory: apps/desktop
        run: dart analyze
      - name: Static analysis
        working-directory: apps/desktop
        run: flutter analyze
      - name: Run widget tests
        working-directory: apps/desktop
        run: flutter test
      - name: Upload 1280x720 UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: the-forge-companion-ui-overhaul-screenshots
          path: apps/desktop/build/ui-screenshots/*.png
          if-no-files-found: error

  macos-build:
    name: macOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
      - name: Sync empty first-party bootstrap pack into desktop assets
        run: python tools/sync_desktop_pack.py
      - name: Resolve desktop dependencies
        working-directory: apps/desktop
        run: flutter pub get
      - name: Dart static analysis
        working-directory: apps/desktop
        run: dart analyze
      - name: Static analysis
        working-directory: apps/desktop
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: apps/desktop
        run: flutter test
      - name: Compile macOS app
        working-directory: apps/desktop
        run: flutter build macos --debug
      - name: Assert bundled bootstrap pack in macOS app
        working-directory: apps/desktop
        run: >-
          python ../../tools/sync_desktop_pack.py --verify
          "build/macos/Build/Products/Debug/The Forge Companion.app/Contents/Frameworks/App.framework/Resources/flutter_assets"

  windows-build:
    name: Windows Build
    runs-on: windows-latest
    needs: [engine-tests, data-tests, flutter-tests, macos-build, linux-build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
      - name: Sync empty first-party bootstrap pack into desktop assets
        run: python tools/sync_desktop_pack.py
      - name: Resolve desktop dependencies
        working-directory: apps/desktop
        run: flutter pub get
      - name: Dart static analysis
        working-directory: apps/desktop
        run: dart analyze
      - name: Static analysis
        working-directory: apps/desktop
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: apps/desktop
        run: flutter test
      - name: Compile Windows app
        working-directory: apps/desktop
        run: >-
          flutter build windows --release
          --build-name=0.1.0
          --build-number=${{ github.run_number }}
          --dart-define=APP_COMMIT_SHA=${{ github.sha }}
          --dart-define=APP_BUILD_VERSION=0.1.0-alpha.${{ github.run_number }}
      - name: Assert bundled bootstrap pack in Windows Release
        working-directory: apps/desktop
        run: >-
          python ../../tools/sync_desktop_pack.py --verify
          "build/windows/x64/runner/Release/data/flutter_assets"
      - name: Write portable alpha build info
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $packDirectory = Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'data/packs') -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          $manifestPath = Join-Path $packDirectory.FullName 'manifest.json'
          $dataVersion = (Get-Content -Raw $manifestPath | ConvertFrom-Json).dataVersion
          if (-not $dataVersion) { throw "Unable to read dataVersion from $manifestPath." }

          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/build/windows/x64/runner/Release'
          if (-not (Get-ChildItem -LiteralPath $releaseDirectory -Filter '*.exe' -File | Select-Object -First 1)) {
            throw "Windows Release executable not found in $releaseDirectory."
          }

          @(
            'ALPHA / TEST BUILD'
            "App version: 0.1.0-alpha.$env:GITHUB_RUN_NUMBER"
            "Commit SHA: $env:GITHUB_SHA"
            "Data version: $dataVersion"
            "Build date (UTC): $((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))"
            'Executable: the_forge_companion.exe'
          ) | Set-Content -LiteralPath (Join-Path $releaseDirectory 'BUILD_INFO.txt') -Encoding utf8
      - name: Package public Windows alpha update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/build/windows/x64/runner/Release'
          $packageDirectory = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/build/windows/x64/runner'
          $zipPath = Join-Path $packageDirectory 'the-forge-companion-windows-alpha.zip'
          if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath -Force }
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $releaseDirectory,
            $zipPath,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false
          )
          $manifestPath = Join-Path $packageDirectory 'windows-alpha-manifest.json'
          $buildInfo = Get-Content -LiteralPath (Join-Path $releaseDirectory 'BUILD_INFO.txt')
          $version = ($buildInfo | Where-Object { $_ -like 'App version: *' } | Select-Object -First 1) -replace '^App version: ', ''
          $dataVersion = ($buildInfo | Where-Object { $_ -like 'Data version: *' } | Select-Object -First 1) -replace '^Data version: ', ''
          $zipHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            platform = 'windows-x64'
            version = $version
            commit = $env:GITHUB_SHA
            dataVersion = $dataVersion
            buildDateUtc = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            sha256 = $zipHash
            size = (Get-Item -LiteralPath $zipPath).Length
            executableName = 'the_forge_companion.exe'
            assetName = [System.IO.Path]::GetFileName($zipPath)
          } | ConvertTo-Json | Set-Content -LiteralPath $manifestPath -Encoding utf8
      - name: Upload portable Windows alpha
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: the-forge-companion-windows-alpha
          path: apps/desktop/build/windows/x64/runner/Release/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
      - name: Publish Windows alpha update release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "v0.1.0-alpha.$env:GITHUB_RUN_NUMBER"
          $packageDirectory = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/build/windows/x64/runner'
          $zipPath = Join-Path $packageDirectory 'the-forge-companion-windows-alpha.zip'
          $manifestPath = Join-Path $packageDirectory 'windows-alpha-manifest.json'
          gh release view $tag --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zipPath $manifestPath --repo $env:GH_REPO --clobber
          } else {
            gh release create $tag $zipPath $manifestPath --repo $env:GH_REPO `
              --title "The Forge Companion Windows Alpha 0.1.0-alpha.$env:GITHUB_RUN_NUMBER" `
              --notes "Commit SHA: $env:GITHUB_SHA`n`nChanges: https://github.com/$env:GH_REPO/commits/$env:GITHUB_SHA`n`nThis prerelease was published after all required CI jobs and the packaged asset validation succeeded. The asset manifest contains SHA-256 and build/data versions." `
              --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Unable to publish Windows alpha release assets.' }

  linux-build:
    name: Linux Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
      - name: Install Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Generate Linux runner scaffold
        working-directory: apps/desktop
        run: flutter create --platforms=linux .
      - name: Sync empty bootstrap pack into desktop assets
        run: python tools/sync_desktop_pack.py
      - name: Resolve desktop dependencies
        working-directory: apps/desktop
        run: flutter pub get
      - name: Build Linux desktop app
        working-directory: apps/desktop
        run: flutter build linux --release
      - name: Assert bundled bootstrap pack in Linux app
        working-directory: apps/desktop
        run: python ../../tools/sync_desktop_pack.py --verify build/linux/x64/release/bundle/data/flutter_assets
